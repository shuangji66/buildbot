# ==================== 网络配置 ====================
# 绑定本机回环地址，如需外部访问请修改或注释此行
bind 127.0.0.1 -::1
# 开启保护模式
protected-mode yes
# 默认端口
port 6379
# TCP 连接队列大小
tcp-backlog 511
# 客户端空闲超时（0 表示不超时）
timeout 0
# TCP 保活时间
tcp-keepalive 300

# ==================== 通用配置 ====================
# 是否以守护进程运行（容器中通常为 no）
daemonize yes
# PID 文件路径
pidfile /var/apps/redis/var/redis.pid
# 日志级别
loglevel notice
# 日志文件路径（空表示输出到标准输出）
logfile /var/apps/redis/var/redis.log
# 数据库数量
databases 16
# 是否总是显示启动 Logo
always-show-logo no
# 是否修改进程标题
set-proc-title yes
# 进程标题模板
proc-title-template "{title} {listen-addr} {server-mode}"
# 本地化排序设置
locale-collate ""

# ==================== RDB 快照持久化 ====================
# RDB 快照失败时是否停止写入
stop-writes-on-bgsave-error yes
# 是否压缩 RDB 文件
rdbcompression yes
# 是否校验 RDB 文件
rdbchecksum yes
# RDB 文件名
dbfilename dump.rdb
# 是否删除同步用的 RDB 文件
rdb-del-sync-files no
# 数据持久化目录
dir /var/apps/redis/var/data

# ==================== 主从复制 ====================
# 从节点在主节点断开时是否继续提供服务
replica-serve-stale-data yes
# 从节点是否只读
replica-read-only yes
# 是否启用无磁盘同步
repl-diskless-sync yes
# 无磁盘同步延迟
repl-diskless-sync-delay 5
# 触发无磁盘同步的最大副本数限制
repl-diskless-sync-max-replicas 0
# 无磁盘加载策略
repl-diskless-load disabled
# 是否禁用 TCP_NODELAY
repl-disable-tcp-nodelay no
# 从节点优先级
replica-priority 100

# ==================== 安全与 ACL ====================
# ACL 日志最大长度
acllog-max-len 128

# ==================== 内存与惰性释放 ====================
# 内存淘汰时是否惰性释放
lazyfree-lazy-eviction no
# 过期键删除时是否惰性释放
lazyfree-lazy-expire no
# 服务端内部删除时是否惰性释放
lazyfree-lazy-server-del no
# 从节点全量同步时是否惰性清空数据库
replica-lazy-flush no
# 用户 DEL 时是否转换为 UNLINK
lazyfree-lazy-user-del no
# 用户 FLUSH 时是否异步
lazyfree-lazy-user-flush no

# ==================== 内核控制 ====================
# OOM 得分调整策略
oom-score-adj no
# 不同角色的 OOM 得分
oom-score-adj-values 0 200 800
# 是否禁用透明大页
disable-thp yes

# ==================== AOF 持久化 ====================
# 是否开启 AOF
appendonly no
# AOF 文件名
appendfilename "appendonly.aof"
# AOF 目录名
appenddirname "appendonlydir"
# AOF 同步策略
appendfsync everysec
# 重写 AOF 时是否暂停 fsync
no-appendfsync-on-rewrite no
# AOF 自动重写增长率
auto-aof-rewrite-percentage 100
# AOF 自动重写最小体积
auto-aof-rewrite-min-size 64mb
# AOF 尾部截断时是否加载
aof-load-truncated yes
# AOF 重写是否使用 RDB 格式
aof-use-rdb-preamble yes
# 是否在 AOF 中记录时间戳
aof-timestamp-enabled no

# ==================== 备份与恢复 ====================
# 备份目录名
backupdirname "backupdir"
# 备份文件保留时间（0 表示不自动清理）
backup-sealed-ttl 0

# ==================== 慢查询与延迟 ====================
# 慢查询阈值（微秒）
slowlog-log-slower-than 10000
# 慢查询日志最大条数
slowlog-max-len 128
# 延迟监控阈值（0 表示关闭）
latency-monitor-threshold 0

# ==================== 事件通知 ====================
# 键空间通知（空表示关闭）
notify-keyspace-events ""

# ==================== 高级配置 ====================
# Hash 使用 listpack 编码的最大条目数及最大值
hash-max-listpack-entries 512
hash-max-listpack-value 64
# Hash 模板编码最小/最大条目数
hash-min-template-entries 0
hash-max-template-entries 0
# RDB 加载时 Hash 模板编码最小/最大条目数
hash-rdb-load-min-template-entries 0
hash-rdb-load-max-template-entries 0
# RDB 加载时 Hash 模板拆解阈值
hash-rdb-load-template-disassembly-threshold 0

# List 节点最大尺寸及压缩深度
list-max-listpack-size -2
list-compress-depth 0

# Set 编码限制
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64

# ZSet 编码限制
zset-max-listpack-entries 128
zset-max-listpack-value 64

# HyperLogLog 稀疏编码最大字节数
hll-sparse-max-bytes 3000

# Stream 节点最大字节数及条目数
stream-node-max-bytes 4096
stream-node-max-entries 100

# Array 切片大小及稀疏编码限制
array-slice-size 4096
array-sparse-kmax 10
array-sparse-kmin 5

# 是否启用主动哈希
activerehashing yes

# 客户端输出缓冲区限制（普通/从节点/发布订阅）
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# 后台任务执行频率及动态调整
hz 10
dynamic-hz yes

# 增量 fsync
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# 启用 jemalloc 后台线程
jemalloc-bg-thread yes


loadmodule /var/apps/redis/target/server/lib/redisbloom.so
loadmodule /var/apps/redis/target/server/lib/redisearch.so
loadmodule /var/apps/redis/target/server/lib/rejson.so
loadmodule /var/apps/redis/target/server/lib/redistimeseries.so