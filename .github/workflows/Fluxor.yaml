name: Build Fluxor and Release

on:
  workflow_dispatch:
    inputs:
      manifest_version:
        description: 'manifest 中的版本号（例如 1.0.0）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            goarch: amd64
            mihomo_assets:
              - 'mihomo-linux-amd64-v3'
              - 'mihomo-linux-amd64-v2'
              - 'mihomo-linux-amd64-v1'
          - os: ubuntu-24.04-arm
            platform: arm
            goarch: arm64
            mihomo_assets:
              - 'mihomo-linux-arm64'
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Fluxor"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 安装依赖（jq、unzip等）
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq unzip

      - name: 克隆 fluxor 源码
        run: |
          git clone https://github.com/shuangji66/fluxor.git fluxor-src
          ls -la fluxor-src

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: fluxor-src/web/package-lock.json

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: 修改 package.json 版本号（追加 commit 哈希）
        run: |
          cd fluxor-src
          HASH=$(git rev-parse --short HEAD)
          VERSION=$(jq -r '.version' web/package.json)
          NEW_VERSION="${VERSION}~${HASH}"
          jq --arg new "$NEW_VERSION" '.version = $new' web/package.json > web/package.json.tmp && mv web/package.json.tmp web/package.json
          echo "新版本号: $NEW_VERSION"

      - name: 构建前端 (web)
        working-directory: ./fluxor-src/web
        run: |
          npm ci
          npm run build

      - name: 构建 Go 后端（指定 GOARCH）
        working-directory: ./fluxor-src
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -tags vue -ldflags="-s -w" -o fluxor-${{ matrix.goarch }}

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v6
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区并创建目录结构
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          mkdir -p "$APP_DIR"/app_tmp/{ui/meta,ui/zash,geoip,bin,ruleset}

      - name: 复制 fluxor 二进制到 app_tmp/bin（带架构后缀）
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          cp fluxor-src/fluxor-${{ matrix.goarch }} "$APP_DIR/app_tmp/bin/"
          chmod +x "$APP_DIR/app_tmp/bin/fluxor-${{ matrix.goarch }}"

      - name: 下载 geosite.dat 和 geoip.dat
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          wget -O "$APP_DIR/app_tmp/geoip/geosite.dat" \
            https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          wget -O "$APP_DIR/app_tmp/geoip/geoip.metadb" \
            https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb

      - name: 下载并解压 zashboard (dist-cdn-fonts.zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          ZASH_URL=$(curl -s -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/Zephyruso/zashboard/releases/latest | \
            jq -r '.assets[] | select(.name == "dist-cdn-fonts.zip") | .browser_download_url')
          if [ -z "$ZASH_URL" ]; then
            echo "错误：未找到 dist-cdn-fonts.zip"
            exit 1
          fi
          wget "$ZASH_URL" -O zash.zip
          unzip zash.zip -d zash_extract
          cp -r zash_extract/dist/* "$APP_DIR/app_tmp/ui/zash/"
          rm -rf zash.zip zash_extract

      - name: 下载并解压 metacubexd (compressed-dist.tgz)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          META_URL=$(curl -s -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest | \
            jq -r '.assets[] | select(.name == "compressed-dist.tgz") | .browser_download_url')
          if [ -z "$META_URL" ]; then
            echo "错误：未找到 compressed-dist.tgz"
            exit 1
          fi
          wget "$META_URL" -O meta.tgz
          mkdir meta_extract
          tar -xzf meta.tgz -C meta_extract
          cp -r meta_extract/* "$APP_DIR/app_tmp/ui/meta/"
          rm -rf meta.tgz meta_extract

      - name: 下载并解压 mihomo (多个版本)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          RELEASES_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          for asset_pattern in ${{ join(matrix.mihomo_assets, ' ') }}; do
            DOWNLOAD_URL=$(echo "$RELEASES_JSON" | jq -r \
              --arg pat "$asset_pattern" '.assets[] | select(.name | test("^" + $pat + "-.*\\.gz$")) | .browser_download_url' | head -1)
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "警告：未找到匹配 $asset_pattern 的 asset"
              continue
            fi
            wget "$DOWNLOAD_URL" -O mihomo.gz
            gunzip -c mihomo.gz > "$APP_DIR/app_tmp/bin/${asset_pattern}"
            chmod +x "$APP_DIR/app_tmp/bin/${asset_pattern}"
            rm mihomo.gz
          done

      - name: 下载规则集文件到 app_tmp/ruleset
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          RULESET_DIR="$APP_DIR/app_tmp/ruleset"
          wget -O "$RULESET_DIR/fakeip-filter.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.mrs"
          wget -O "$RULESET_DIR/ads.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ads.mrs"
          wget -O "$RULESET_DIR/private.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.mrs"
          wget -O "$RULESET_DIR/trackerslist.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/trackerslist.mrs"
          wget -O "$RULESET_DIR/applications.list" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/applications.list"
          wget -O "$RULESET_DIR/microsoft-cn.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.mrs"
          wget -O "$RULESET_DIR/apple-cn.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/apple-cn.mrs"
          wget -O "$RULESET_DIR/google-cn.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/google-cn.mrs"
          wget -O "$RULESET_DIR/games-cn.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games-cn.mrs"
          wget -O "$RULESET_DIR/games.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games.mrs"
          wget -O "$RULESET_DIR/netflix.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/netflix.mrs"
          wget -O "$RULESET_DIR/disney.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/disney.mrs"
          wget -O "$RULESET_DIR/max.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/max.mrs"
          wget -O "$RULESET_DIR/primevideo.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/primevideo.mrs"
          wget -O "$RULESET_DIR/appletv.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/appletv.mrs"
          wget -O "$RULESET_DIR/youtube.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/youtube.mrs"
          wget -O "$RULESET_DIR/tiktok.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/tiktok.mrs"
          wget -O "$RULESET_DIR/bilibili.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/bilibili.mrs"
          wget -O "$RULESET_DIR/spotify.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/spotify.mrs"
          wget -O "$RULESET_DIR/media.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/media.mrs"
          wget -O "$RULESET_DIR/ai.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ai.mrs"
          wget -O "$RULESET_DIR/networktest.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/networktest.mrs"
          wget -O "$RULESET_DIR/tld-proxy.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/tld-proxy.mrs"
          wget -O "$RULESET_DIR/gfw.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/gfw.mrs"
          wget -O "$RULESET_DIR/proxy.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.mrs"
          wget -O "$RULESET_DIR/cn.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.mrs"
          wget -O "$RULESET_DIR/privateip.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/privateip.mrs"
          wget -O "$RULESET_DIR/cnip.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cnip.mrs"
          wget -O "$RULESET_DIR/telegramip.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/telegramip.mrs"
          wget -O "$RULESET_DIR/netflixip.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/netflixip.mrs"
          wget -O "$RULESET_DIR/mediaip.mrs" "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/mediaip.mrs"

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
