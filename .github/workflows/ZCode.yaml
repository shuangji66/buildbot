name: Build ZCode Releases

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 拉取 ZCode 源码
      - name: Checkout ZCode repository
        uses: actions/checkout@v6
        with:
          repository: zai-org/ZCode

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 【关键修复】必须先全量编译源码
      - name: Build Monorepo
        run: pnpm build

      # 打包 ZCode 发行版（建议用环境变量传入地址）
      - name: Build ZCode Distribution
        run: pnpm build:zcode
        env:
          ZCODE_DIST_BASE_URL: "https://abc.com/zcode/"

      - name: Verify releases directory
        run: |
          if [ ! -d "dist/zcode/releases" ]; then
            echo "错误：dist/zcode/releases 目录不存在，构建可能失败"
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          echo "releases 目录内容："
          ls -la dist/zcode/releases/

      - name: Package releases as tar.gz
        run: |
          cd dist/zcode
          tar -czf /tmp/zcode-releases.tar.gz releases/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zcode-releases
          path: /tmp/zcode-releases.tar.gz
          retention-days: 7
