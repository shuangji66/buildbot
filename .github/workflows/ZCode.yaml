name: Build ZCode Releases

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout ZCode repository
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch TSConfig paths for Vite resolution
        run: |
          if [ -f "tsconfig.base.json" ]; then
            jq '.compilerOptions.paths["@zcode/shared/*"] = ["packages/shared/src/*"]' tsconfig.base.json > tsconfig.base.json.tmp
            mv tsconfig.base.json.tmp tsconfig.base.json
            echo "✅ Patched tsconfig.base.json"
          else
            echo "⚠️ tsconfig.base.json not found, skipping patch."
          fi

      - name: Build Monorepo
        run: pnpm build

      - name: Build ZCode Distribution
        run: pnpm build:zcode
        env:
          ZCODE_DIST_BASE_URL: "https://abc.com/zcode/"

      - name: Verify releases directory
        run: |
          if [ ! -d "dist/zcode/releases" ]; then
            echo "错误：dist/zcode/releases 目录不存在，构建可能失败"
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          echo "releases 目录内容："
          ls -la dist/zcode/releases/

      - name: Package releases as tar.gz
        run: |
          cd dist/zcode
          tar -czf /tmp/zcode-releases.tar.gz releases/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-releases
          path: /tmp/zcode-releases.tar.gz
          retention-days: 7
