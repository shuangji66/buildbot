name: Build Tvheadend and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 26.9.24，留空则使用当前日期）'
        required: false
        type: string
        default: ''
      changelog:
        description: '更新日志（支持中文，留空则使用默认文案）'
        required: false
        type: string
        default: ''
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 0 1 */2 *'   # 每两个月的 1 号 0:00 UTC 触发（1/3/5/7/9/11 月）

jobs:
  # ========== 第一步：在 Debian bookworm 容器中编译 Tvheadend ==========
  build-in-container:
    name: 构建 Tvheadend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            container: debian:bookworm
          - os: ubuntu-24.04-arm
            platform: arm
            container: debian:bookworm
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
      options: --user root
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      version: ${{ steps.set_vars.outputs.version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          # 定时触发时无 inputs，回退使用当前日期（格式：26.9.24）
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(date -u +'%y.%-m.%-d')
          fi
          CHANGELOG="${{ github.event.inputs.changelog }}"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="定时自动构建"
          fi
          echo "app_name=Tvheadend" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "版本: $VERSION"
          echo "更新日志: $CHANGELOG"

      - name: 安装构建依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git cmake pkg-config gettext \
            libssl-dev libdvbcsa-dev libavahi-client-dev libsqlite3-dev \
            libusb-1.0-0-dev zlib1g-dev wget python3 python3-pip \
            libxml2-dev libva-dev libvdpau-dev libdrm-dev libasound2-dev libpulse-dev \
            autotools-dev file
          ln -sf /usr/bin/python3 /usr/bin/python

      - name: 构建并安装 Tvheadend
        run: |
          WORKDIR="${{ github.workspace }}/tvheadend"
          git clone https://github.com/tvheadend/tvheadend.git "$WORKDIR"
          cd "$WORKDIR"

          # 解决 aarch64 上 config.guess 过旧的问题
          if [ -x /usr/share/misc/config.guess ]; then
            TRIPLET="$(/usr/share/misc/config.guess)"
          else
            TRIPLET="$(uname -m)-unknown-linux-gnu"
          fi
          SITE="$RUNNER_TEMP/config.site"
          printf 'build_alias=%s\nhost_alias=%s\ntarget_alias=%s\n' \
            "$TRIPLET" "$TRIPLET" "$TRIPLET" > "$SITE"
          export CONFIG_SITE="$SITE"

          ./configure --prefix=/var/apps/Tvheadend/target
          make -j$(nproc)
          make install

          echo "=== 安装目录树 ==="
          find /var/apps/Tvheadend/target -type f | head -50

      - name: 收集 libdvbcsa.so.1
        run: |
          ARCH_DIR="$(uname -m)-linux-gnu"
          REAL_LIB="/usr/lib/${ARCH_DIR}/libdvbcsa.so.1.0.1"
          if [ ! -f "$REAL_LIB" ]; then
            REAL_LIB="$(find /usr/lib -name 'libdvbcsa.so.1.*' -type f | head -1)"
          fi

          mkdir -p /tmp/extra-libs
          if [ -n "$REAL_LIB" ] && [ -f "$REAL_LIB" ]; then
            cp "$REAL_LIB" /tmp/extra-libs/libdvbcsa.so.1
            echo "已收集: $REAL_LIB"
          else
            echo "::warning::未找到 libdvbcsa.so.1 真实文件"
          fi

      - name: 打包 target 目录
        run: |
          mkdir -p /tmp/package
          cp -a /var/apps/Tvheadend/target /tmp/package/target
          mkdir -p /tmp/package/target/extra-libs
          if [ -f /tmp/extra-libs/libdvbcsa.so.1 ]; then
            cp /tmp/extra-libs/libdvbcsa.so.1 /tmp/package/target/extra-libs/
          fi

          tar -czf "${GITHUB_WORKSPACE}/tvheadend-${{ matrix.platform }}.tar.gz" \
            -C /tmp/package target

      - name: 上传 target 打包文件
        uses: actions/upload-artifact@v7
        with:
          name: target-${{ matrix.platform }}
          path: tvheadend-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  # ========== 第二步：在宿主机打包 fpk ==========
  package:
    name: 打包 fpk
    needs: build-in-container
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      version: ${{ steps.set_vars.outputs.version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          echo "app_name=${{ needs.build-in-container.outputs.app_name }}" >> $GITHUB_OUTPUT
          echo "version=${{ needs.build-in-container.outputs.version }}" >> $GITHUB_OUTPUT
          echo "changelog=${{ needs.build-in-container.outputs.changelog }}" >> $GITHUB_OUTPUT

      - name: 下载 target 打包文件
        uses: actions/download-artifact@v7
        with:
          name: target-${{ matrix.platform }}
          path: ./target_artifact

      - name: 解压 target 打包文件
        run: |
          mkdir -p target-extracted
          tar -xzf ./target_artifact/tvheadend-${{ matrix.platform }}.tar.gz -C target-extracted
          echo "解压完成，目录结构："
          find target-extracted -maxdepth 3 | head -50

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ needs.build-in-container.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 将构建物复制到 app 目录
        run: |
          APP_DIR="build_workspace/Tvheadend/app"
          mkdir -p "$APP_DIR"
          cp -a target-extracted/target/. "$APP_DIR/"
          echo "复制完成，app 目录内容："
          ls -la "$APP_DIR"
          find "$APP_DIR" -type f | head -30

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/Tvheadend/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          VERSION="${{ needs.build-in-container.outputs.version }}"
          CHANGELOG="${{ needs.build-in-container.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build Tvheadend
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="Tvheadend-${{ needs.build-in-container.outputs.version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 第三步：发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: package
    if: always() && needs.package.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.package.outputs.app_name }}
      manifest_version: ${{ needs.package.outputs.version }}
      changelog: ${{ needs.package.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
