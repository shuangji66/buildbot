name: Build Read and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '上游软件版本号（例如 3.4.6）'
        required: true
        type: string
      manifest_version:
        description: 'manifest 中的版本号（例如 3.4.6-2）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      upstream_version: ${{ steps.set_vars.outputs.upstream_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Read"
          VERSION="${{ github.event.inputs.version }}"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "upstream_version=$VERSION" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 从 autobcb/read latest release 下载 web 包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/autobcb/read/releases/latest")
          TAG_NAME=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
          echo "Latest release tag: $TAG_NAME"
          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("web.*\\.zip")) | .browser_download_url' | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：未找到 web*.zip 文件"
            exit 1
          fi
          echo "下载地址: $DOWNLOAD_URL"
          wget "$DOWNLOAD_URL" -O web.zip
          unzip web.zip -d extracted
          echo "解压完成，目录结构："
          ls -la extracted/

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v6
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工具和模板
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          cp "buildbot_repo/fnpack/fnpack-1.2.3-linux-amd64" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      # ========== 项目特有的复制步骤 ==========
      - name: 将解压的 Read 文件复制到 app/jar_tmp 目录（仅 libs 和 read.jar）
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app/app_tmp"
          mkdir -p "$APP_DIR"
          if [ $(ls -1 extracted | wc -l) -eq 1 ] && [ -d "extracted/$(ls extracted)" ]; then
            BASE_DIR="extracted/$(ls extracted)"
          else
            BASE_DIR="extracted"
          fi
          if [ -d "$BASE_DIR/libs" ]; then
            cp -r "$BASE_DIR/libs" "$APP_DIR/"
          else
            echo "警告：未找到 libs 目录"
          fi
          if [ -f "$BASE_DIR/read.jar" ]; then
            cp "$BASE_DIR/read.jar" "$APP_DIR/"
          else
            echo "错误：未找到 read.jar 文件"
            exit 1
          fi
          echo "复制完成，app/app_tmp 目录内容："
          ls -la "$APP_DIR"
      # =====================================

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-all.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact（供发布任务使用）
        uses: actions/upload-artifact@v7
        with:
          name: fpk-all
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
