name: Manual Publish and Update fnpack.json

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用名称（与 fnpack.json 中的键名一致，例如 Aria2）'
        required: true
        type: string
      release_tag:
        description: 'Release 标签（例如 2026.9.5）'
        required: true
        type: string
      manifest_version:
        description: '版本号（例如 1.0.1）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string

jobs:
  publish:
    name: 手动发布并更新 fnpack.json
    runs-on: ubuntu-24.04
    steps:
      - name: 检出 Fndepot 仓库
        uses: actions/checkout@v7
        with:
          repository: shuangji66/Fndepot
          token: ${{ secrets.BUILDBOT }}
          path: fndepot_repo

      - name: 校验应用存在
        run: |
          cd fndepot_repo
          APP_NAME="${{ github.event.inputs.app_name }}"
          if ! jq -e --arg app "$APP_NAME" '.apps[$app]' fnpack.json > /dev/null; then
            echo "❌ 错误：fnpack.json 中不存在应用 \"$APP_NAME\"，请检查应用名拼写"
            exit 1
          fi

      - name: 通过 GitHub API 获取各架构 digest 与 size
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          APP_NAME="${{ github.event.inputs.app_name }}"
          TAG="${{ github.event.inputs.release_tag }}"
          VERSION="${{ github.event.inputs.manifest_version }}"

          assets_json=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets')
          if [ -z "$assets_json" ] || [ "$assets_json" = "null" ]; then
            echo "❌ 错误：无法获取 Release ${TAG} 的资产信息"
            exit 1
          fi

          PACKAGES='{}'
          FOUND=0

          for arch in x86 arm all; do
            filename="${APP_NAME}-${VERSION}-${arch}.fpk"
            info=$(echo "$assets_json" | jq --arg name "$filename" '.[] | select(.name == $name) | {size, digest}')

            if [ -z "$info" ] || [ "$info" = "null" ]; then
              echo "ℹ️ 未找到 $filename，跳过"
              continue
            fi

            digest=$(echo "$info" | jq -r '.digest')
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "⚠️ $filename 缺少 digest 字段，跳过"
              continue
            fi

            size=$(echo "$info" | jq -r '.size')
            sha256=$(echo "$digest" | sed 's/^sha256://')
            url="https://github.com/${REPO}/releases/download/${TAG}/${filename}"

            echo "✅ $filename: sha256=$sha256, size=$size"
            PACKAGES=$(echo "$PACKAGES" | jq \
              --arg arch "$arch" \
              --arg url "$url" \
              --arg sha256 "$sha256" \
              --arg size "$size" \
              '.[$arch] = {download_url: $url, sha256: $sha256, size: ($size | tonumber)}')
            FOUND=$((FOUND + 1))
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "❌ 错误：未找到任何匹配的 fpk 资产（尝试了 x86 / arm / all）"
            exit 1
          fi

          echo "共找到 $FOUND 个架构的资产"
          echo "packages<<EOF" >> $GITHUB_OUTPUT
          echo "$PACKAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 更新 fnpack.json
        run: |
          cd fndepot_repo

          APP_NAME="${{ github.event.inputs.app_name }}"
          VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          PACKAGES='${{ steps.fetch.outputs.packages }}'

          jq --arg app "$APP_NAME" \
             --arg version "$VERSION" \
             --arg changelog "$CHANGELOG" \
             --argjson packages "$PACKAGES" \
             '.apps[$app].releases[$version] = {
                 "changelog": $changelog,
                 "packages": $packages
             }' fnpack.json > fnpack.json.tmp
          mv fnpack.json.tmp fnpack.json

          echo "✅ 已更新，写入的片段如下："
          jq --arg app "$APP_NAME" --arg version "$VERSION" '.apps[$app].releases[$version]' fnpack.json

      - name: 提交并推送
        run: |
          cd fndepot_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore: manually update ${{ github.event.inputs.app_name }} to ${{ github.event.inputs.manifest_version }} (${{ github.event.inputs.release_tag }})"
          git push
          echo "🚀 已推送到 shuangji66/Fndepot"
