name: Build Terminal and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0-1），同时注入二进制和 manifest'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: 构建并打包
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      version: ${{ steps.set_vars.outputs.version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Terminal"
          VERSION="${{ github.event.inputs.version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 检出 shuangji66/terminal 仓库
        uses: actions/checkout@v7
        with:
          repository: shuangji66/terminal
          path: terminal-src

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装 Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: 构建前端
        working-directory: ./terminal-src/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 准备 embed 目录
        run: |
          mkdir -p ./terminal-src/backend/embed
          cp -r ./terminal-src/frontend/dist/* ./terminal-src/backend/embed/

      - name: 构建 Go 二进制（原生，注入版本号）
        working-directory: ./terminal-src/backend
        run: |
          GOOS=linux CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X main.terminalVersion=${{ steps.set_vars.outputs.version }}" \
            -o terminal .
          chmod +x terminal
          file terminal
          ls -la terminal

      - name: 检出 buildbot 仓库（包含 fnpack 模板）
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/Terminal" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制二进制到 app/bin 目录
        run: |
          mkdir -p build_workspace/Terminal/app/bin
          cp terminal-src/backend/terminal build_workspace/Terminal/app/bin/terminal
          chmod +x build_workspace/Terminal/app/bin/terminal
          echo "app/bin 目录内容："
          ls -la build_workspace/Terminal/app/bin/

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/Terminal/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          VERSION="${{ steps.set_vars.outputs.version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build Terminal
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="Terminal-${{ steps.set_vars.outputs.version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
