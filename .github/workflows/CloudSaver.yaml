name: Build CloudSaver and Release

on:
  workflow_dispatch:
    inputs:
      docker_version:
        description: 'CloudSaver Docker 镜像版本标签（例如0.9.1）'
        required: true
        type: string
      manifest_version:
        description: 'manifest 中的版本号'
        required: true
        type: string
      changelog:
        description: 'manifest 中的更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置变量（docker版本、manifest版本、changelog）
        id: set_vars
        run: |
          APP_NAME="CloudSaver"
          DOCKER_VERSION="${{ github.event.inputs.docker_version }}"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          if [ -z "$DOCKER_VERSION" ] || [ -z "$MANIFEST_VERSION" ]; then
            echo "错误：版本号不能为空"
            exit 1
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "docker_version=$DOCKER_VERSION" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "Docker 版本: $DOCKER_VERSION"
          echo "manifest 版本: $MANIFEST_VERSION"
          echo "更新日志: $CHANGELOG"

      - name: 拉取 CloudSaver Docker 镜像
        run: |
          docker pull jiangrui1994/cloudsaver:${{ steps.set_vars.outputs.docker_version }}

      - name: 从镜像中提取所需文件和目录
        run: |
          CONTAINER_ID=$(docker create jiangrui1994/cloudsaver:${{ steps.set_vars.outputs.docker_version }})
          mkdir -p extracted/app/config
          docker cp "$CONTAINER_ID":/app/package.json extracted/app/
          docker cp "$CONTAINER_ID":/app/package-lock.json extracted/app/
          docker cp "$CONTAINER_ID":/app/release-content.local.default.json extracted/app/config/release-content.local.json
          docker cp "$CONTAINER_ID":/app/dist-final extracted/app/
          docker cp "$CONTAINER_ID":/usr/share/nginx/html extracted/app/
          docker rm "$CONTAINER_ID"
          echo "提取完成，目录结构："
          ls -la extracted/
          ls -la extracted/app/

      - name: 检出本仓库 (shuangji66/buildbot)
        uses: actions/checkout@v6
        with:
          path: buildbot_repo

      - name: 准备 fnpack 打包工作区
        run: |
          mkdir -p build_workspace
          cp -r buildbot_repo/fnpack/CloudSaver build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 将提取的产物复制到 CloudSaver/app 模板目录
        run: |
          mv extracted/app/package*.json build_workspace/CloudSaver/app/
          mv extracted/app/dist-final build_workspace/CloudSaver/app/
          mv extracted/app/html build_workspace/CloudSaver/app/
          mv extracted/app/config/release-content.local.json build_workspace/CloudSaver/app/config/
          echo "复制完成，app 目录内容："
          ls -la build_workspace/CloudSaver/app/

      - name: 安装 Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 执行 npm install
        run: |
          cd build_workspace/CloudSaver/app
          npm ci --omit=dev
          tar -czf node_modules.tar.gz node_modules
          rm -rf node_modules

      - name: 修改 manifest 文件（替换版本号、更新日志和平台）
        run: |
          MANIFEST_PATH="build_workspace/CloudSaver/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build CloudSaver
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="CloudSaver-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
