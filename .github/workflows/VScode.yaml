name: Build VScode and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 1.141.2）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文，默认：更新上游版本）'
        required: false
        type: string
        default: '更新上游版本'
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            asset_arch: x64
          - os: ubuntu-24.04-arm
            platform: arm
            asset_arch: arm64
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="VScode"
          MANIFEST_VERSION="${{ github.event.inputs.version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "发布版本: $MANIFEST_VERSION"

      - name: 下载 VS Code Server（${{ matrix.platform }}）
        run: |
          ASSET_ARCH="${{ matrix.asset_arch }}"
          DOWNLOAD_URL="https://update.code.visualstudio.com/latest/server-linux-${ASSET_ARCH}-web/stable"
          echo "下载地址: $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o vscode-server.tar.gz
          echo "下载完成："
          ls -lh vscode-server.tar.gz
          file vscode-server.tar.gz

      - name: 解压并准备 server 目录
        run: |
          mkdir -p vscode-extract
          tar -xzf vscode-server.tar.gz -C vscode-extract
          echo "解压完成，目录内容："
          find vscode-extract -maxdepth 2 | head -20

          # 定位解压后的根目录（例如 vscode-server-linux-x64）
          ROOT_DIR=$(find vscode-extract -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -z "$ROOT_DIR" ]; then
            echo "错误：未找到解压后的根目录"
            exit 1
          fi
          echo "解压根目录: $ROOT_DIR"

          # 重命名为 server
          mv "$ROOT_DIR" server
          echo "重命名后 server 目录内容："
          ls -la server/

          # 删除 node 二进制文件
          if [ -f server/node ]; then
            echo "删除 node 二进制文件"
            rm -f server/node
          else
            echo "未找到 server/node，跳过删除"
          fi
          ls -la server/

      - name: 原位压缩为 server.tar.xz（保留软链接）
        run: |
          # 使用 tar 压缩，默认保留软链接
          tar -cJf server.tar.xz server
          echo "压缩完成："
          ls -lh server.tar.xz
          echo "压缩包内文件列表（前 20 项）："
          tar -tJf server.tar.xz | head -20

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工具和模板
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制 server.tar.xz 到 app 目录
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          mkdir -p "$APP_DIR"
          cp server.tar.xz "$APP_DIR/"
          echo "复制完成，app 目录内容："
          ls -la "$APP_DIR"

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot（调用通用发布工作流） ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
