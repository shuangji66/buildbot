name: Build wb2api and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      version: ${{ steps.set_vars.outputs.version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="wb2api"
          VERSION="${{ github.event.inputs.version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "版本: $VERSION"

      - name: 安装 Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: 克隆 wb2api 源码
        uses: actions/checkout@v7
        with:
          repository: linguo2625469/workbuddy2api-panel
          path: wb2api-src

      - name: 编译 wb2api 二进制
        working-directory: ./wb2api-src
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o wb2api ./cmd/server
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o signin_bin ./cmd/signin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o login ./cmd/login
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o credit ./cmd/credit
          ls -la wb2api signin_bin login credit

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工具和模板
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制构建物到 app/server
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app/server"
          mkdir -p "$APP_DIR"
          cp wb2api-src/wb2api "$APP_DIR/"
          cp wb2api-src/signin_bin "$APP_DIR/"
          cp wb2api-src/login "$APP_DIR/"
          cp wb2api-src/credit "$APP_DIR/"
          chmod +x "$APP_DIR"/wb2api "$APP_DIR"/signin_bin "$APP_DIR"/login "$APP_DIR"/credit
          echo "复制完成，app/server 目录内容："
          ls -la "$APP_DIR"

      - name: 复制脚本文件到 app/server
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app/server"
          cp wb2api-src/login.sh "$APP_DIR/"
          cp wb2api-src/signin.sh "$APP_DIR/"
          cp wb2api-src/credit.sh "$APP_DIR/"
          chmod +x "$APP_DIR"/login.sh "$APP_DIR"/signin.sh "$APP_DIR"/credit.sh
          mkdir -p "$APP_DIR/scripts"
          cp wb2api-src/scripts/probe_active.py "$APP_DIR/scripts/"
          echo "脚本复制完成，app/server 目录内容："
          ls -la "$APP_DIR"
          ls -la "$APP_DIR/scripts"

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          VERSION="${{ steps.set_vars.outputs.version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot（调用通用发布工作流） ==========
  publish:
    name: 发布到 Fndepot Release（调用通用发布工作流）
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
