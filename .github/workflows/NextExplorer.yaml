name: Build NextExplorer and Release

on:
  workflow_dispatch:
    inputs:
      manifest_version:
        description: 'manifest 中的版本号（例如 3.1.0）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            seven_zip_arch: linux-x64
            rg_arch: x86_64
            poppler_arch: x86_64
          - os: ubuntu-24.04-arm
            platform: arm
            seven_zip_arch: linux-arm64
            rg_arch: aarch64
            poppler_arch: aarch64
    runs-on: ${{ matrix.os }}
    container: debian:bookworm
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="NextExplorer"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 安装依赖（Node.js、jq、git等）
        run: |
          apt-get update
          apt-get install -y curl wget git jq xz-utils zstd
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs

      - name: 获取工具最新版本号
        id: tool_versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 7-Zip 最新版本
          SEVEN_ZIP_TAG=$(curl -fsSL \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ip7z/7zip/releases/latest | jq -r '.tag_name')
          echo "7-Zip 最新版本: $SEVEN_ZIP_TAG"
          if [ -z "$SEVEN_ZIP_TAG" ] || [ "$SEVEN_ZIP_TAG" = "null" ]; then
            echo "错误：无法获取 7-Zip 最新版本"
            exit 1
          fi
          # 从 "26.03" 生成文件名版本 "2603"（去掉点）
          SEVEN_ZIP_FILE_VER=$(echo "$SEVEN_ZIP_TAG" | sed 's/\.//g')
          echo "seven_zip_tag=$SEVEN_ZIP_TAG" >> $GITHUB_OUTPUT
          echo "seven_zip_file_ver=$SEVEN_ZIP_FILE_VER" >> $GITHUB_OUTPUT

          # ripgrep 最新版本
          RG_TAG=$(curl -fsSL \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BurntSushi/ripgrep/releases/latest | jq -r '.tag_name')
          echo "ripgrep 最新版本: $RG_TAG"
          if [ -z "$RG_TAG" ] || [ "$RG_TAG" = "null" ]; then
            echo "错误：无法获取 ripgrep 最新版本"
            exit 1
          fi
          echo "rg_tag=$RG_TAG" >> $GITHUB_OUTPUT

          # poppler-utils 最新版本
          POPPLER_TAG=$(curl -fsSL \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/unpins/poppler-utils/releases/latest | jq -r '.tag_name')
          echo "poppler-utils 最新版本: $POPPLER_TAG"
          if [ -z "$POPPLER_TAG" ] || [ "$POPPLER_TAG" = "null" ]; then
            echo "错误：无法获取 poppler-utils 最新版本"
            exit 1
          fi
          # 从 "v26.06.0-1" 生成 "26.06.0-1"
          POPPLER_FILE_VER=$(echo "$POPPLER_TAG" | sed 's/^v//')
          echo "poppler_tag=$POPPLER_TAG" >> $GITHUB_OUTPUT
          echo "poppler_file_ver=$POPPLER_FILE_VER" >> $GITHUB_OUTPUT

      - name: 检出 buildbot 仓库（包含 NextExplorer 模板）
        uses: actions/checkout@v6
        with:
          path: buildbot_repo

      - name: 克隆 NextExplorer 源码
        run: |
          git clone https://github.com/nxzai/NextExplorer.git nextexplorer-src
          ls -la nextexplorer-src

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 构建 NextExplorer运行时
        run: |
          mkdir -p app/backend app/frontend app/docs
          cp nextexplorer-src/package.json app/
          cp nextexplorer-src/package-lock.json app/
          cp nextexplorer-src/backend/package.json app/backend/package.json
          cp nextexplorer-src/frontend/package.json app/frontend/package.json
          cp nextexplorer-src/docs/package.json app/docs/package.json
          cd app
          npm ci --omit=dev --workspace backend && npm cache clean --force

      - name: 构建 NextExplorer前端编译环境
        run: |
          mkdir -p temp/backend temp/frontend temp/docs
          cp nextexplorer-src/package.json temp/
          cp nextexplorer-src/package-lock.json temp/
          cp nextexplorer-src/backend/package.json temp/backend/package.json
          cp nextexplorer-src/frontend/package.json temp/frontend/package.json
          cp nextexplorer-src/docs/package.json temp/docs/package.json
          cd temp
          npm ci --workspace frontend

      - name: 构建 NextExplorer前端
        run: |
          cp -r nextexplorer-src/frontend/* temp/frontend/
          cd temp
          npm run -w frontend build -- --sourcemap false

      - name: 压缩node_modules
        run: |
          cd app
          tar -cJf node_modules.tar.xz node_modules

      - name: 组装 NextExplorer
        run: |
          mkdir -p build_workspace/NextExplorer/app/server
          mv app/node_modules.tar.xz build_workspace/NextExplorer/app/server/
          mv app/package.json build_workspace/NextExplorer/app/server/
          mv nextexplorer-src/backend/src build_workspace/NextExplorer/app/server/src
          mv temp/frontend/dist build_workspace/NextExplorer/app/server/src/public

      # ========== 下载并集成 7-Zip、ripgrep、poppler-utils 到 app/utils/ ==========
      - name: 下载并提取 7-Zip
        run: |
          UTILS_DIR="build_workspace/NextExplorer/app/utils"
          mkdir -p "$UTILS_DIR"
          SEVEN_ZIP_FILE_VER="${{ steps.tool_versions.outputs.seven_zip_file_ver }}"
          SEVEN_ZIP_URL="https://github.com/ip7z/7zip/releases/download/${{ steps.tool_versions.outputs.seven_zip_tag }}/7z${SEVEN_ZIP_FILE_VER}-${{ matrix.seven_zip_arch }}.tar.xz"
          echo "下载 7-Zip: $SEVEN_ZIP_URL"
          curl -fL "$SEVEN_ZIP_URL" -o 7z.tar.xz
          mkdir -p 7z-extract
          tar -xJf 7z.tar.xz -C 7z-extract
          SEVEN_ZIP_BIN=$(find 7z-extract -type f -name "7zzs" | head -1)
          if [ -z "$SEVEN_ZIP_BIN" ]; then
            echo "错误：未找到 7zzs"
            exit 1
          fi
          cp "$SEVEN_ZIP_BIN" "$UTILS_DIR/7z"
          chmod +x "$UTILS_DIR/7z"
          echo "7z 已提取到 $UTILS_DIR/7z"
          file "$UTILS_DIR/7z"

      - name: 下载并提取 ripgrep
        run: |
          UTILS_DIR="build_workspace/NextExplorer/app/utils"
          RG_TAG="${{ steps.tool_versions.outputs.rg_tag }}"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_TAG}/ripgrep-${RG_TAG}-${{ matrix.rg_arch }}-unknown-linux-musl.tar.gz"
          echo "下载 ripgrep: $RG_URL"
          curl -fL "$RG_URL" -o rg.tar.gz
          mkdir -p rg-extract
          tar -xzf rg.tar.gz -C rg-extract
          RG_BIN=$(find rg-extract -type f -name "rg" | head -1)
          if [ -z "$RG_BIN" ]; then
            echo "错误：未找到 rg"
            exit 1
          fi
          cp "$RG_BIN" "$UTILS_DIR/rg"
          chmod +x "$UTILS_DIR/rg"
          echo "rg 已提取到 $UTILS_DIR/rg"
          file "$UTILS_DIR/rg"

      - name: 下载并提取 poppler-utils
        run: |
          UTILS_DIR="build_workspace/NextExplorer/app/utils"
          POPPLER_FILE_VER="${{ steps.tool_versions.outputs.poppler_file_ver }}"
          POPPLER_URL="https://github.com/unpins/poppler-utils/releases/download/${{ steps.tool_versions.outputs.poppler_tag }}/poppler-utils-${POPPLER_FILE_VER}-${{ matrix.poppler_arch }}-linux.zst"
          echo "下载 poppler-utils: $POPPLER_URL"
          curl -fL "$POPPLER_URL" -o poppler-utils.zst
          zstd -d poppler-utils.zst -o poppler-utils
          chmod +x poppler-utils
          cp poppler-utils "$UTILS_DIR/poppler-utils"
          echo "poppler-utils 已提取到 $UTILS_DIR/poppler-utils"
          file "$UTILS_DIR/poppler-utils"
      # =============================================================================

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
