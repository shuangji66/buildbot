name: build redis

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Redis version (e.g., 8.10.2)'
        required: true
        default: '8.10.2'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download and Extract Redis Source
        run: |
          VERSION="${{ github.event.inputs.version }}"
          URL="https://github.com/redis/redis/releases/download/${VERSION}/redis-full.tar.gz"
          echo "Downloading from: $URL"
          curl -fL -o redis-full.tar.gz "$URL"
          tar -xzf redis-full.tar.gz
          rm redis-full.tar.gz
          ls -d redis-*

      - name: Prepare target dir
        run: mkdir -p dist

      - name: Build & install in Debian 12 (${{ matrix.arch }})
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/dist:/var/apps/redis/target" \
            -w "/src/redis-${VERSION}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            debian:12 \
            bash -c '
              set -e
              apt-get update
              # 补全 libclang-dev, clang 等 Rust 绑定所需的依赖
              apt-get install -y --no-install-recommends \
                build-essential pkg-config libssl-dev tcl ca-certificates \
                cmake python3 python3-pip python3-venv python3-dev \
                clang libclang-dev automake autoconf libtool git wget unzip rsync curl

              # 安装最新版 Rust (避开 Debian 12 自带的旧版 Cargo)
              echo "Installing latest Rust toolchain..."
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source "$HOME/.cargo/env"

              echo "Start compiling..."
              make -j"$(nproc)" BUILD_TLS=yes
              
              echo "Start testing..."
              make test

              echo "Start installing..."
              mkdir -p /var/apps/redis/target/server
              make install PREFIX=/var/apps/redis/target/server

              # 拷贝配置文件
              mkdir -p /var/apps/redis/target/server/etc
              cp redis.conf /var/apps/redis/target/server/etc/redis.conf

              # 修正属主
              chown -R "${HOST_UID}:${HOST_GID}" /var/apps/redis/target
            '

      - name: Package server.tar.gz
        run: |
          cd dist
          tar -czf server.tar.gz server
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: redis-debian12-${{ matrix.arch }}
          path: dist/server.tar.gz
