name: build redis

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Redis version (e.g., 8.10.2)'
        required: true
        default: '8.10.2'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download and Extract Redis Source
        run: |
          VERSION="${{ github.event.inputs.version }}"
          URL="https://github.com/redis/redis/releases/download/${VERSION}/redis-full.tar.gz"
          echo "Downloading from: $URL"
          curl -fL -o redis-full.tar.gz "$URL"
          tar -xzf redis-full.tar.gz
          rm redis-full.tar.gz
          ls -d redis-*

      - name: Prepare target dir
        run: mkdir -p dist

      - name: Build & install in Debian 12 (${{ matrix.arch }})
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/dist:/var/apps/redis/target" \
            -w "/src/redis-${VERSION}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            debian:12 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential pkg-config libssl-dev tcl ca-certificates \
                cmake python3 python-is-python3 python3-pip python3-venv python3-dev \
                clang libclang-dev automake autoconf libtool git wget unzip rsync curl \
                xz-utils \
                zlib1g-dev liblz4-dev libbz2-dev libgomp1

              echo "Installing latest Rust toolchain..."
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source "$HOME/.cargo/env"

              echo "Start compiling..."
              
              # 全局屏蔽 GCC 12 的未初始化等误报警告，防止中断编译
              export CFLAGS="-Wno-error -Wno-uninitialized -Wno-maybe-uninitialized -Wno-error=uninitialized -Wno-error=maybe-uninitialized -Wno-error=array-bounds -Wno-error=stringop-overflow -Wno-error=deprecated-declarations"
              export CXXFLAGS="$CFLAGS"

              # 编译（Redis 8 默认包含模块编译）
              make -j2 BUILD_TLS=yes LTO=no
              
              echo "Start testing (ignoring failures)..."
              make test || true

              echo "Start installing..."
              mkdir -p /var/apps/redis/target/server
              make install PREFIX=/var/apps/redis/target/server

              echo "Collecting built modules..."
              mkdir -p /var/apps/redis/target/server/lib
              
              # 拷贝四大模块到统一的 lib 目录
              cp modules/redisbloom/redisbloom.so /var/apps/redis/target/server/lib/ || true
              cp modules/redisjson/rejson.so /var/apps/redis/target/server/lib/ || true
              cp modules/redistimeseries/redistimeseries.so /var/apps/redis/target/server/lib/ || true
              find modules/redisearch -name "redisearch.so" -exec cp {} /var/apps/redis/target/server/lib/ \; || true

              # 如果不需要 make install 默认生成的配置文件，可将其删除以保持产物纯净
              # rm -rf /var/apps/redis/target/server/etc

              # 修正属主
              chown -R "${HOST_UID}:${HOST_GID}" /var/apps/redis/target
            '

      - name: Package server.tar.xz
        run: |
          cd dist
          # -c 创建归档，-J 使用 xz 压缩，-f 指定文件名
          tar -cJf server.tar.xz server
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: redis-debian12-${{ matrix.arch }}
          path: dist/server.tar.xz
