name: Build Siyuan Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout siyuan source
        uses: actions/checkout@v7
        with:
          repository: siyuan-note/siyuan
          path: src

      - name: Prepare server dir
        run: mkdir -p server

      - name: Build frontend assets (node:22-bookworm)
        run: |
          cat > build-app.sh <<'SH'
          set -euo pipefail
          corepack enable
          corepack install --global "$(node -e 'console.log(require("./package.json").packageManager)')"
          if [ -n "${NPM_REGISTRY:-}" ]; then
            npm config set registry "${NPM_REGISTRY}"
          fi
          pnpm install --silent
          pnpm run build
          node scripts/trimChangelogs.js
          mkdir -p /out
          cp -r appearance stage guide /out/
          if [ -d changelogs ]; then cp -r changelogs /out/; fi
          SH
          docker run --rm \
            -v "$PWD/src:/src" \
            -v "$PWD/server:/out" \
            -v "$PWD/build-app.sh:/build-app.sh:ro" \
            -w /src/app \
            -e NPM_REGISTRY \
            node:22-bookworm \
            bash /build-app.sh
          ls -l server

      - name: Patch kernel to honor HOME
        run: |
          cat > src/kernel/util/home_override.go <<'GO'
          package util

          import (
              "os"

              "github.com/88250/gulu"
          )

          func homeDirFromEnv() string {
              if home := os.Getenv("HOME"); "" != home {
                  return home
              }
              if home, err := gulu.OS.Home(); nil == err {
                  return home
              }
              return ""
          }
          GO
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("src/kernel/util/working.go")
          s = p.read_text()
          s, n = re.subn(r"HomeDir,\s*_\s*=\s*gulu\.OS\.Home\(\)", "HomeDir = homeDirFromEnv()", s)
          assert n == 1, n
          p.write_text(s)
          PY

      - name: Build kernel (golang:1.26-bookworm)
        run: |
          docker run --rm \
            -v "$PWD/src:/src" \
            -v "$PWD/server:/out" \
            -w /src/kernel \
            golang:1.26-bookworm \
            bash -euc 'go version && CGO_ENABLED=1 go build -buildvcs=false -tags "fts5 sqlcipher" -ldflags "-s -w" -o /out/kernel .'
          ls -l server/kernel

      - name: Compress server to server.tar.xz
        run: |
          tar -cJf server.tar.xz server
          ls -lh server.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.arch }}
          path: server.tar.xz
