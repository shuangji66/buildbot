name: Package Hermes

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:12

    steps:
      - name: Install Node.js 24 and essential tools
        run: |
          apt update
          apt install -y curl git python3 build-essential
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt install -y nodejs

      - name: Create target directory
        run: mkdir -p /var/apps/Hermes/target/server

      - name: Install hermes-agent and hermes-web-ui into server
        run: npm install -g hermes-agent hermes-web-ui --prefix /var/apps/Hermes/target/server

      - name: Compress server directory
        run: |
          cd /var/apps/Hermes/target
          tar -czf server.tar.gz server

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-package-${{ matrix.runner }}
          path: /var/apps/Hermes/target/server.tar.gz
