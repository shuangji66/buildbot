name: Build mi-paiai and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.9.1）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  # ========== 第一步：在 Debian 12 容器中构建 server.tar.gz ==========
  build-in-container:
    name: 构建 server.tar.gz
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    container:
      image: debian:12
      options: --user root
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      version: ${{ steps.set_vars.outputs.version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          echo "app_name=mi-paiai" >> $GITHUB_OUTPUT
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "changelog=${{ github.event.inputs.changelog }}" >> $GITHUB_OUTPUT

      - name: 检出源码
        uses: actions/checkout@v7
        with:
          repository: clawpai/mi-paiai

      - name: 安装系统依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gnupg \
            build-essential \
            python3 \
            git \
            xz-utils \
            unzip \
            zip
          rm -rf /var/lib/apt/lists/*

      - name: 安装 Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          node --version
          npm --version

      - name: 安装 pnpm 9.15.9
        run: |
          npm install --global pnpm@9.15.9
          pnpm --version

      - name: 安装依赖
        run: |
          pnpm install --frozen-lockfile

      - name: 构建 core 和 web
        run: |
          pnpm --filter @mi-paiai/core build
          pnpm --filter @mi-paiai/web build

      - name: 准备目标目录（复刻 Dockerfile runtime 阶段）
        run: |
          TARGET=/var/apps/mi-paiai/target/server
          mkdir -p "$TARGET"
          mkdir -p "$TARGET/apps/web"

          # 1. 根 node_modules
          cp -r node_modules "$TARGET/node_modules"

          # 2. apps/web/node_modules
          if [ -d apps/web/node_modules ]; then
            cp -r apps/web/node_modules "$TARGET/apps/web/node_modules"
          fi

          # 3. apps/web/dist
          cp -r apps/web/dist "$TARGET/apps/web/dist"

          # 4. apps/web/package.json
          cp apps/web/package.json "$TARGET/apps/web/package.json"

          echo "=== 目标目录树（深度 3） ==="
          find "$TARGET" -maxdepth 3 -type d | sort
          echo "=== 目标目录大小 ==="
          du -sh "$TARGET"

      - name: 创建压缩包
        run: |
          cd /var/apps/mi-paiai/target
          tar -czf server.tar.gz server
          ls -lh server.tar.gz

      - name: 上传 server.tar.gz 作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}
          path: /var/apps/mi-paiai/target/server.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ========== 第二步：在宿主机打包 fpk ==========
  package:
    name: 打包 fpk
    needs: build-in-container
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      version: ${{ steps.set_vars.outputs.version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          echo "app_name=${{ needs.build-in-container.outputs.app_name }}" >> $GITHUB_OUTPUT
          echo "version=${{ needs.build-in-container.outputs.version }}" >> $GITHUB_OUTPUT
          echo "changelog=${{ needs.build-in-container.outputs.changelog }}" >> $GITHUB_OUTPUT

      - name: 下载对应架构的 server.tar.gz
        uses: actions/download-artifact@v7
        with:
          name: server-${{ matrix.platform }}
          path: ./server_artifact

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ needs.build-in-container.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制 server.tar.gz 到 app 目录
        run: |
          APP_DIR="build_workspace/mi-paiai/app"
          mkdir -p "$APP_DIR"
          cp ./server_artifact/server.tar.gz "$APP_DIR/"
          echo "复制完成，app 目录内容："
          ls -la "$APP_DIR"

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/mi-paiai/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          VERSION="${{ needs.build-in-container.outputs.version }}"
          CHANGELOG="${{ needs.build-in-container.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build mi-paiai
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="mi-paiai-${{ needs.build-in-container.outputs.version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 第三步：发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: package
    if: always() && needs.package.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.package.outputs.app_name }}
      manifest_version: ${{ needs.package.outputs.version }}
      changelog: ${{ needs.package.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
