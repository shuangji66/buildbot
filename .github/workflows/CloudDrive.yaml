name: Build CloudDrive and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '上游版本号（例如 1.0.18，不带 v）'
        required: true
        type: string
      manifest_version:
        description: 'manifest 中的版本号（留空则与上游版本号一致）'
        required: false
        type: string
        default: ''
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            asset_arch: x86_64
          - os: ubuntu-24.04-arm
            platform: arm
            asset_arch: aarch64
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="CloudDrive"
          VERSION="${{ github.event.inputs.version }}"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          # 未填写 manifest_version 时，回退使用上游版本号
          if [ -z "$MANIFEST_VERSION" ]; then
            MANIFEST_VERSION="$VERSION"
          fi
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "upstream_version=$VERSION" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "上游版本: $VERSION"
          echo "manifest 版本: $MANIFEST_VERSION"

      - name: 下载并解压 CloudDrive（${{ matrix.platform }}）
        run: |
          VERSION="${{ steps.set_vars.outputs.upstream_version }}"
          ASSET_ARCH="${{ matrix.asset_arch }}"
          DOWNLOAD_URL="https://github.com/cloud-fs/cloud-fs.github.io/releases/download/v${VERSION}/clouddrive-2-linux-${ASSET_ARCH}-${VERSION}.tgz"
          echo "下载地址: $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o clouddrive.tgz
          mkdir -p clouddrive-extract
          tar -xzf clouddrive.tgz -C clouddrive-extract
          echo "解压完成，目录结构："
          find clouddrive-extract -maxdepth 2 | head -50

          # 定位 clouddrive 二进制
          CD_BIN=$(find clouddrive-extract -type f -name "clouddrive" | head -1)
          if [ -z "$CD_BIN" ]; then
            echo "错误：未在解压目录中找到 clouddrive 二进制"
            exit 1
          fi
          cp "$CD_BIN" clouddrive
          chmod +x clouddrive
          echo "clouddrive 二进制："
          ls -la clouddrive
          file clouddrive

          # 定位 wwwroot 目录
          WWWROOT_DIR=$(find clouddrive-extract -type d -name "wwwroot" | head -1)
          if [ -z "$WWWROOT_DIR" ]; then
            echo "错误：未在解压目录中找到 wwwroot 目录"
            exit 1
          fi
          echo "wwwroot 目录：$WWWROOT_DIR"
          ls -la "$WWWROOT_DIR"
          # 记录路径供后续步骤使用
          echo "WWWROOT_DIR=$WWWROOT_DIR" >> $GITHUB_ENV

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工具和模板
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制二进制与 wwwroot 到 app/server 目录
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app/server"
          mkdir -p "$APP_DIR"
          cp clouddrive "$APP_DIR/"
          chmod +x "$APP_DIR/clouddrive"
          cp -r "$WWWROOT_DIR" "$APP_DIR/wwwroot"
          echo "复制完成，app/server 目录内容："
          ls -la "$APP_DIR"
          echo "wwwroot 目录内容："
          ls -la "$APP_DIR/wwwroot" | head -30

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
