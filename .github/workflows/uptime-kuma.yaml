name: Build Uptime Kuma and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Uptime Kuma 源码版本号（例如 2.2.1，不带 v）'
        required: true
        type: string
      manifest_version:
        description: 'manifest 中的版本号（例如 2.2.1，可不同于源码版本）'
        required: true
        type: string
      changelog:
        description: 'manifest 中的更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置变量（源码版本、manifest版本、changelog）
        id: set_vars
        run: |
          APP_NAME="uptime-kuma"
          VERSION_SOURCE="${{ github.event.inputs.version }}"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          if [ -z "$VERSION_SOURCE" ] || [ -z "$MANIFEST_VERSION" ]; then
            echo "错误：版本号不能为空"
            exit 1
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "version_source=$VERSION_SOURCE" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "源码版本: $VERSION_SOURCE"
          echo "manifest版本: $MANIFEST_VERSION"
          echo "更新日志: $CHANGELOG"

      - name: 下载并解压源码包（使用指定的源码版本号）
        run: |
          VERSION_SOURCE="${{ steps.set_vars.outputs.version_source }}"
          DOWNLOAD_URL="https://github.com/louislam/uptime-kuma/archive/refs/tags/${VERSION_SOURCE}.tar.gz"
          echo "下载地址: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o source.tar.gz
          mkdir uptime-kuma
          tar -xzf source.tar.gz --strip-components=1 -C uptime-kuma
          rm source.tar.gz
          ls -la uptime-kuma

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: uptime-kuma/package-lock.json

      - name: 执行构建 (npm ci --omit dev --no-audit && npm run download-dist)
        run: |
          cd uptime-kuma
          npm ci --omit dev --no-audit
          npm run download-dist

      - name: 检出本仓库 (shuangji66/buildbot)
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 打包工作区
        run: |
          mkdir -p build_workspace
          cp -r buildbot_repo/fnpack/uptime-kuma build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.1-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.1-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 将构建产物复制到 uptime-kuma/app
        run: |
          mv uptime-kuma/db build_workspace/uptime-kuma/app/
          mv uptime-kuma/extra build_workspace/uptime-kuma/app/
          mv uptime-kuma/src build_workspace/uptime-kuma/app/
          mv uptime-kuma/node_modules build_workspace/uptime-kuma/app/
          mv uptime-kuma/server build_workspace/uptime-kuma/app/
          mv uptime-kuma/dist build_workspace/uptime-kuma/app/
          mv uptime-kuma/package*.json build_workspace/uptime-kuma/app/
          cd build_workspace/uptime-kuma/app
          tar -czf node_modules.tar.gz node_modules
          rm -rf node_modules

      - name: 修改 manifest 文件（替换版本号和更新日志）
        run: |
          MANIFEST_PATH="build_workspace/uptime-kuma/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s\n' "$CHANGELOG" | sed 's/[&/\]/\\&/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build uptime-kuma
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="uptime-kuma-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot（调用通用多架构发布工作流） ==========
  publish:
    name: 发布到 Fndepot Release（调用通用多架构发布工作流）
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    uses: ./.github/workflows/Publish-x86-arm.yaml
    with:
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
      artifact_pattern: 'fpk-*'
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
