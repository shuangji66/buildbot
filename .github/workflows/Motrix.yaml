name: Extract and Package Motrix Server

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'motrixapp/motrix-server image tag'
        required: false
        default: '2.0.0-beta.44'
        type: string

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Pull motrixapp/motrix-server:${{ inputs.image_tag }}
        run: docker pull motrixapp/motrix-server:${{ inputs.image_tag }}

      - name: Install xz-utils and create server.tar.xz inside container
        run: |
          docker run --rm \
            --user root \
            -v ${{ github.workspace }}:/workspace \
            --workdir /app \
            motrixapp/motrix-server:${{ inputs.image_tag }} \
            sh -c "
              apk add --no-cache xz && \
              tar -cJf /workspace/server.tar.xz -C /app .
            "

      - name: Verify archive
        run: |
          ls -lh server.tar.xz
          file server.tar.xz

      - name: Upload server.tar.xz
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.arch }}
          path: server.tar.xz
          if-no-files-found: error
