name: Build Harness with dshmarket and Release

on:
  workflow_dispatch:
    inputs:
      harness_version:
        description: 'Harness 二进制版本号（例如 1.0.0，将注入到二进制中）'
        required: true
        type: string
        default: '1.0.0'
      dsh_version:
        description: 'dsh 包版本（例如 0.1.2-alpha.5，或 latest）'
        required: true
        default: '0.1.2-alpha.5'
        type: string
      manifest_version:
        description: 'manifest 中的版本号（例如 0.1.2）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  # ========== 第一步：构建 harness 二进制（来自 shuangji66/dsh） ==========
  build-harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      HARNESS_VERSION: ${{ github.event.inputs.harness_version }}   # 从输入获取版本号
    steps:
      - name: 检出 shuangji66/dsh 仓库
        uses: actions/checkout@v7
        with:
          repository: shuangji66/dsh
          path: dsh-src

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装 Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: 构建前端
        working-directory: ./dsh-src/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 准备 embed 目录
        run: |
          mkdir -p ./dsh-src/backend/embed
          cp -r ./dsh-src/frontend/dist/* ./dsh-src/backend/embed/

      - name: 构建 Go 二进制（${{ matrix.arch }}）并注入版本号
        working-directory: ./dsh-src/backend
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X main.harnessVersion=$HARNESS_VERSION" -o harness-${{ matrix.arch }} .

      - name: 上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: harness-${{ matrix.arch }}
          path: ./dsh-src/backend/harness-${{ matrix.arch }}

  # ========== 第二步：在 Debian 12 容器内构建 dsh 并生成 server.tar.gz ==========
  build-in-container:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    container: debian:12
    outputs:
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          echo "manifest_version=${{ github.event.inputs.manifest_version }}" >> $GITHUB_OUTPUT
          echo "changelog=${{ github.event.inputs.changelog }}" >> $GITHUB_OUTPUT

      - name: 安装系统依赖和 Node.js 24
        run: |
          apt-get update
          apt-get install -y curl tar jq xz-utils
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          node -v
          npm -v

      - name: 打包 @deepseek-ai/dsh 并修改 package.json
        id: pack
        run: |
          VERSION="${{ github.event.inputs.dsh_version }}"
          if [ "$VERSION" = "latest" ]; then
            VERSION=$(npm view @deepseek-ai/dsh version)
          fi
          PACKED=$(npm pack "@deepseek-ai/dsh@$VERSION")
          echo "PACKED=$PACKED" >> $GITHUB_ENV
          tar xzf "$PACKED"

      - name: 添加 dshmarket 依赖
        run: |
          cd package
          jq '.dependencies = (.dependencies // {} | . + {"dshmarket": "latest"})' package.json > tmp.json
          mv tmp.json package.json
          cat package.json

      - name: 重新打包
        run: tar czf "$PACKED" package

      - name: 安装修改后的包到 /var/apps/Harness/target/server
        run: |
          mkdir -p /var/apps/Harness/target/server
          cd /var/apps/Harness/target/server
          npm init -y
          npm install "$GITHUB_WORKSPACE/$PACKED" --prefix /var/apps/Harness/target/server

      - name: 修改 dsh-app-boot 中的 PROFILE_TEMPLATES.web.bundles
        run: |
          FILE="/var/apps/Harness/target/server/node_modules/@deepseek-ai/dsh-app-boot/lib/index.js"
          if [ ! -f "$FILE" ]; then
            echo "警告：$FILE 不存在，跳过修改"
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const file = process.argv[1];
            let content = fs.readFileSync(file, 'utf8');

            const varName = 'PROFILE_TEMPLATES';
            const assignIndex = content.indexOf(varName + ' = {');
            if (assignIndex === -1) {
              console.error('未找到 PROFILE_TEMPLATES 定义');
              process.exit(1);
            }

            // 定位 PROFILE_TEMPLATES 对象的完整范围
            let braceCount = 0;
            let start = assignIndex + content.substring(assignIndex).indexOf('{');
            let end = start;
            for (let i = start; i < content.length; i++) {
              if (content[i] === '{') braceCount++;
              else if (content[i] === '}') {
                braceCount--;
                if (braceCount === 0) {
                  end = i;
                  break;
                }
              }
            }
            if (braceCount !== 0) {
              console.error('PROFILE_TEMPLATES 大括号不匹配');
              process.exit(1);
            }

            const fullMatch = content.substring(start, end + 1);

            // 在 fullMatch 中查找 web: { ... }
            const webStart = fullMatch.indexOf('web:');
            if (webStart === -1) {
              console.error('未找到 web 属性');
              process.exit(1);
            }
            let webObjStart = fullMatch.indexOf('{', webStart);
            if (webObjStart === -1) {
              console.error('未找到 web 对象起始');
              process.exit(1);
            }

            // 计数定位 web 对象的结束
            let webBraceCount = 0;
            let webObjEnd = webObjStart;
            for (let i = webObjStart; i < fullMatch.length; i++) {
              if (fullMatch[i] === '{') webBraceCount++;
              else if (fullMatch[i] === '}') {
                webBraceCount--;
                if (webBraceCount === 0) {
                  webObjEnd = i;
                  break;
                }
              }
            }
            if (webBraceCount !== 0) {
              console.error('web 对象大括号不匹配');
              process.exit(1);
            }
            const webObjStr = fullMatch.substring(webObjStart, webObjEnd + 1);

            // 在 webObjStr 中查找 bundles 数组
            const bundlesRegex = /bundles\\s*:\\s*\\[([^\\]]*)\\]/;
            const bundlesMatch = webObjStr.match(bundlesRegex);
            if (!bundlesMatch) {
              console.error('未找到 web 中的 bundles 数组');
              process.exit(1);
            }

            // 提取数组项并检查是否已包含 dshmarket
            let items = bundlesMatch[1].split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (items.includes('\"dshmarket\"')) {
              console.log('dshmarket 已在 web.bundles 中，跳过');
            } else {
              items.push('\"dshmarket\"');
              const newArrayStr = '[' + items.join(', ') + ']';
              // 替换 bundles 数组
              const newWebObjStr = webObjStr.replace(bundlesRegex, 'bundles: ' + newArrayStr);
              // 将新 web 对象替换回 fullMatch
              const newFullMatch = fullMatch.substring(0, webObjStart) + newWebObjStr + fullMatch.substring(webObjEnd + 1);
              // 写回文件
              content = content.substring(0, start) + newFullMatch + content.substring(end + 1);
              fs.writeFileSync(file, content);
              console.log('已成功将 dshmarket 添加到 PROFILE_TEMPLATES.web.bundles');
            }

            // 输出附近片段以供检查
            const snippet = content.substring(
              Math.max(0, assignIndex - 20),
              Math.min(content.length, assignIndex + 300)
            );
            console.log('--- 定义附近片段 ---');
            console.log(snippet);
          " "$FILE"

      - name: 压缩 server 目录
        run: |
          tar czf "$GITHUB_WORKSPACE/server-${{ matrix.platform }}.tar.gz" \
            -C /var/apps/Harness/target server

      - name: 上传 server.tar.gz 作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}
          path: server-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  # ========== 第三步：在宿主机（容器外）使用 fnpack 打包 ==========
  package:
    name: 打包 fpk
    needs: [build-harness, build-in-container]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量（从 build-in-container 继承）
        id: set_vars
        run: |
          echo "app_name=Harness" >> $GITHUB_OUTPUT
          echo "manifest_version=${{ needs.build-in-container.outputs.manifest_version }}" >> $GITHUB_OUTPUT
          echo "changelog=${{ needs.build-in-container.outputs.changelog }}" >> $GITHUB_OUTPUT

      - name: 映射平台到架构
        id: map_arch
        run: |
          if [ "${{ matrix.platform }}" = "x86" ]; then
            echo "arch=amd64" >> $GITHUB_OUTPUT
          else
            echo "arch=arm64" >> $GITHUB_OUTPUT
          fi

      - name: 下载对应架构的 server.tar.gz
        uses: actions/download-artifact@v7
        with:
          name: server-${{ matrix.platform }}
          path: ./server_artifact

      - name: 下载对应架构的 harness 二进制
        uses: actions/download-artifact@v7
        with:
          name: harness-${{ steps.map_arch.outputs.arch }}
          path: ./harness_artifact

      - name: 检出 buildbot 仓库（包含 fnpack 模板）
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/Harness" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.1-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.1-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 组装 app 目录
        run: |
          mkdir -p build_workspace/Harness/app/bin
          # 复制 server.tar.gz
          cp ./server_artifact/server-${{ matrix.platform }}.tar.gz build_workspace/Harness/app/server.tar.gz
          # 复制并重命名 harness
          cp ./harness_artifact/harness-${{ steps.map_arch.outputs.arch }} build_workspace/Harness/app/bin/harness
          chmod +x build_workspace/Harness/app/bin/harness
          ls -la build_workspace/Harness/app/

      - name: 修改 manifest 文件
        run: |
          APP_NAME="Harness"
          MANIFEST_PATH="build_workspace/$APP_NAME/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ needs.build-in-container.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build-in-container.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build Harness
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="Harness-${{ needs.build-in-container.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 第四步：发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: package
    if: always() && needs.package.result == 'success' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有架构的 fpk 文件
        uses: actions/download-artifact@v7
        with:
          path: fpk_files
          merge-multiple: true

      - name: 生成当前日期 tag（格式 年.月.日）
        id: date_tag
        run: |
          TAG=$(date +'%Y.%-m.%-d')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=【$TAG 更新】" >> $GITHUB_OUTPUT

      - name: 使用 GitHub CLI 发布到 shuangji66/Fndepot
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          TITLE="${{ steps.date_tag.outputs.RELEASE_TITLE }}"
          MANIFEST_VERSION="${{ needs.package.outputs.manifest_version }}"
          CHANGELOG="${{ needs.package.outputs.changelog }}"
          NEW_NOTE="构建 ${{ needs.package.outputs.app_name }} 版本 ${MANIFEST_VERSION}。更新日志：${CHANGELOG}"

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG 已存在，将添加资产并追加描述"
            CURRENT_BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
            if [ -n "$CURRENT_BODY" ]; then
              NEW_BODY="${CURRENT_BODY}"$'\n'"$NEW_NOTE"
            else
              NEW_BODY="$NEW_NOTE"
            fi
            gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NEW_NOTE"
          fi

          for fpk in fpk_files/*.fpk; do
            echo "上传 $fpk"
            gh release upload "$TAG" "$fpk" --repo "$REPO" --clobber
          done

      - name: 更新 fnpack.json 中的 Harness 条目
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          APP_NAME="${{ needs.package.outputs.app_name }}"
          MANIFEST_VERSION="${{ needs.package.outputs.manifest_version }}"
          CHANGELOG="${{ needs.package.outputs.changelog }}"

          DOWNLOAD_URL_X86="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-x86.fpk"
          DOWNLOAD_URL_ARM="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-arm.fpk"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" fndepot_repo
          cd fndepot_repo

          jq --arg app "$APP_NAME" \
             --arg version "$MANIFEST_VERSION" \
             --arg changelog "$CHANGELOG" \
             --arg url_x86 "$DOWNLOAD_URL_X86" \
             --arg url_arm "$DOWNLOAD_URL_ARM" \
             '.[$app].version = $version |
              .[$app].changelog = $changelog |
              .[$app].arch_diff.x86.download_url = $url_x86 |
              .[$app].arch_diff.arm.download_url = $url_arm' \
             fnpack.json > fnpack.json.tmp
          mv fnpack.json.tmp fnpack.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore: update ${APP_NAME} to ${MANIFEST_VERSION} (${TAG})"
          git push
