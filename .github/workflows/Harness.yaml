name: Build and pack modified dsh

on:
  workflow_dispatch:          # 手动触发，可按需调整

jobs:
  build:
    strategy:
      matrix:
        arch: [x86, arm]
        include:
          - arch: x86
            runner: ubuntu-latest
          - arch: arm
            runner: ubuntu-24.04-arm   # GitHub 官方 ARM 运行器（公开预览）
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:12          # 所有步骤在 Debian 12 容器中运行

    steps:
      - name: Install system dependencies & Node.js 24
        run: |
          apt-get update
          apt-get install -y curl tar jq xz-utils
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          node -v
          npm -v

      # 无需检出代码，因为我们只操作 npm 包

      - name: Pack @deepseek-ai/dsh
        id: pack
        run: |
          PACKED=$(npm pack @deepseek-ai/dsh@latest)
          echo "PACKED=$PACKED" >> $GITHUB_ENV
          tar xzf "$PACKED"

      - name: Modify package.json – add dshmarket dependency
        run: |
          cd package
          jq '.dependencies = (.dependencies // {} | . + {"dshmarket": "latest"})' package.json > tmp.json
          mv tmp.json package.json
          cat package.json   # 可选：验证修改

      - name: Repack modified tarball
        run: |
          tar czf "$PACKED" package

      - name: Install modified package into /var/apps/Harness/target/server
        run: |
          mkdir -p /var/apps/Harness/target/server
          cd /var/apps/Harness/target/server
          npm init -y
          # 使用 $GITHUB_WORKSPACE 引用容器内挂载的工作空间
          npm install "$GITHUB_WORKSPACE/$PACKED"

      - name: Compress server directory
        run: |
          tar czf "$GITHUB_WORKSPACE/server-${{ matrix.arch }}.tar.gz" \
            -C /var/apps/Harness/target server

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.arch }}
          path: server-${{ matrix.arch }}.tar.gz
