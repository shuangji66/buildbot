name: Build mi-paiai in Debian 12 Container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    container:
      image: debian:12
      options: --user root

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: clawpai/mi-paiai

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gnupg \
            build-essential \
            python3 \
            git \
            xz-utils \
            unzip \
            zip
          rm -rf /var/lib/apt/lists/*

      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          node --version
          npm --version

      - name: Install pnpm 9.15.9
        run: |
          npm install --global pnpm@9.15.9
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build core and web
        run: |
          pnpm --filter @mi-paiai/core build
          pnpm --filter @mi-paiai/web build

      - name: Prepare target directory (复刻 Dockerfile runtime 阶段)
        run: |
          TARGET=/var/apps/mi-paipai/target/server
          mkdir -p "$TARGET"
          mkdir -p "$TARGET/apps/web"
          mkdir -p "$TARGET/config"

          # 1. 根 node_modules
          cp -r node_modules "$TARGET/node_modules"

          # 2. apps/web/node_modules
          if [ -d apps/web/node_modules ]; then
            cp -r apps/web/node_modules "$TARGET/apps/web/node_modules"
          fi

          # 3. apps/web/dist
          cp -r apps/web/dist "$TARGET/apps/web/dist"

          # 4. apps/web/package.json
          cp apps/web/package.json "$TARGET/apps/web/package.json"

          echo "=== Target directory tree (depth 3) ==="
          find "$TARGET" -maxdepth 3 -type d | sort
          echo "=== Target directory size ==="
          du -sh "$TARGET"

      - name: Create archive
        run: |
          cd /var/apps
          tar -czf mi-paipai-server-${{ matrix.arch }}.tar.gz mi-paipai/target/server
          ls -lh mi-paipai-server-${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mi-paipai-server-${{ matrix.arch }}
          path: /var/apps/mi-paipai-server-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30
