name: Build Aria2-next

on:
  workflow_dispatch:

jobs:
  build:
    name: Linux ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: ubuntu-22.04
            arch: x86_64
          - label: ARM64
            runner: ubuntu-22.04-arm
            arch: aarch64

    env:
      PREFIX_PATH: /var/apps/Aria2-next/target          # 安装前缀
      ARIA2_BUILD_PROFILE: release                       # 固定 release
      STRIP_BINARY: true                                 # release 时 strip
      NPROC: 2
      # 依赖版本和下载 URL（无 SHA256）
      ZLIB_VERSION: 1.3.1
      EXPAT_VERSION: 2.5.0
      SQLITE_AUTOCONF_VERSION: 3430000
      CARES_VERSION: 1.28.1
      LIBSSH2_VERSION: 1.11.0
      BOOST_VERSION: 1.83.0
      LIBTORRENT_VERSION: 2.0.10
      ZLIB_URL: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
      EXPAT_URL: https://github.com/libexpat/libexpat/releases/download/R_2_5_0/expat-2.5.0.tar.gz
      SQLITE_URL: https://www.sqlite.org/2023/sqlite-autoconf-3430000.tar.gz
      CARES_URL: https://github.com/c-ares/c-ares/releases/download/cares-1_28_1/c-ares-1.28.1.tar.gz
      LIBSSH2_URL: https://www.libssh2.org/download/libssh2-1.11.0.tar.gz
      BOOST_URL: https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz
      LIBTORRENT_URL: https://github.com/arvidn/libtorrent/releases/download/v2.0.10/libtorrent-rasterbar-2.0.10.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: AnInsomniacy/aria2-next   # 显式指定仓库

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential make binutils cmake ninja-build pkg-config curl tar ca-certificates \
            libssl-dev perl file

      - name: Build and package aria2-next (release)
        shell: bash
        run: |
          set -eu
          
          # 升级 CMake 到 3.25+（aria2-next 要求）
          CMAKE_VERSION=3.25.2
          CMAKE_ARCH="${{ matrix.arch }}"   # x86_64 或 aarch64
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}.tar.gz" -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /opt
          export PATH="/opt/cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}/bin:$PATH"
          rm /tmp/cmake.tar.gz
          cmake --version   # 验证版本
         
          cd "$GITHUB_WORKSPACE"
          repo_root="$PWD"
          jobs="${NPROC:-$(nproc)}"

          # release 编译参数（固定）
          RELEASE_CPPFLAGS="-DNDEBUG"
          RELEASE_CFLAGS="-O2 -pipe -flto=auto -fno-semantic-interposition"
          RELEASE_CXXFLAGS="-O2 -pipe -flto=auto -fno-semantic-interposition"
          RELEASE_LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,--gc-sections -flto=auto"
          CMAKE_BUILD_TYPE="Release"

          # 下载依赖（不校验 SHA256）
          curl -fsSL -o zlib.tar.gz "$ZLIB_URL"
          curl -fsSL -o expat.tar.gz "$EXPAT_URL"
          curl -fsSL -o sqlite.tar.gz "$SQLITE_URL"
          curl -fsSL -o c-ares.tar.gz "$CARES_URL"
          curl -fsSL -o libssh2.tar.gz "$LIBSSH2_URL"
          curl -fsSL -o boost.tar.gz "$BOOST_URL"
          curl -fsSL -o libtorrent.tar.gz "$LIBTORRENT_URL"

          deps_prefix="$PWD/build/deps"
          rm -rf "$deps_prefix" build/release
          mkdir -p "$deps_prefix"

          # ----- 编译 zlib -----
          # ----- 编译 zlib (使用 CMake) -----
          tar xf zlib.tar.gz && cd "zlib-$ZLIB_VERSION"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$deps_prefix" \
            -DCMAKE_C_FLAGS="-O2" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build -j"$jobs" --target install
          cd "$repo_root"

          # ----- 编译 expat -----
          tar xf expat.tar.gz && cd "expat-$EXPAT_VERSION"
          CPPFLAGS="$RELEASE_CPPFLAGS" CFLAGS="$RELEASE_CFLAGS" LDFLAGS="$RELEASE_LDFLAGS" \
            ./configure --disable-shared --enable-static --prefix="$deps_prefix"
          make -j"$jobs" && make install
          cd "$repo_root"

          # ----- 编译 sqlite3 -----
          tar xf sqlite.tar.gz && cd "sqlite-autoconf-$SQLITE_AUTOCONF_VERSION"
          CPPFLAGS="$RELEASE_CPPFLAGS" CFLAGS="$RELEASE_CFLAGS" LDFLAGS="$RELEASE_LDFLAGS" \
            ./configure --disable-shared --enable-static --prefix="$deps_prefix"
          make -j"$jobs" && make install
          cd "$repo_root"

          # ----- 编译 c-ares -----
          tar xf c-ares.tar.gz && cd "c-ares-$CARES_VERSION"
          CPPFLAGS="$RELEASE_CPPFLAGS" CFLAGS="$RELEASE_CFLAGS" LDFLAGS="$RELEASE_LDFLAGS" \
            ./configure --disable-shared --enable-static --prefix="$deps_prefix"
          make -j"$jobs" && make install
          cd "$repo_root"

          # ----- 编译 libssh2（依赖 OpenSSL）-----
          tar xf libssh2.tar.gz && cd "libssh2-$LIBSSH2_VERSION"
          CPPFLAGS="-I$deps_prefix/include $RELEASE_CPPFLAGS" CFLAGS="$RELEASE_CFLAGS" LDFLAGS="$RELEASE_LDFLAGS" \
            ./configure --disable-shared --enable-static --prefix="$deps_prefix" \
              --with-crypto=openssl \
              PKG_CONFIG_PATH="$deps_prefix/lib/pkgconfig"
          make -j"$jobs" && make install
          cd "$repo_root"

          # ----- 编译 libtorrent（需要 Boost 头文件）-----
          tar xf boost.tar.gz
          tar xf libtorrent.tar.gz && cd "libtorrent-rasterbar-$LIBTORRENT_VERSION"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX="$deps_prefix" \
            -DCMAKE_CXX_FLAGS="$RELEASE_CXXFLAGS" \
            -DCMAKE_C_FLAGS="$RELEASE_CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$RELEASE_LDFLAGS" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBoost_INCLUDE_DIR="$repo_root/boost_1_83_0" \
            -DCMAKE_PREFIX_PATH="$deps_prefix"
          cmake --build build -j"$jobs" --target install
          cd "$repo_root"

          # ----- 配置并编译 aria2-next -----
          # ----- 配置并编译 aria2-next -----
          PKG_CONFIG_PATH="$deps_prefix/lib/pkgconfig" \
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
            -DARIA2_STATIC_DEPENDENCIES=ON \
            -DARIA2_WITH_OPENSSL=ON \
            -DARIA2_WITH_EXPAT=ON \
            -DARIA2_WITH_CARES=ON \
            -DARIA2_WITH_SQLITE3=ON \
            -DARIA2_WITH_LIBSSH2=ON \
            -DCMAKE_C_FLAGS="$RELEASE_CFLAGS" \
            -DCMAKE_CXX_FLAGS="$RELEASE_CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$RELEASE_LDFLAGS" \
            -DARIA2_RELEASE_SIZE_OPTIMIZED=ON \
            -DCMAKE_SKIP_RPATH=ON \
            -DCMAKE_PREFIX_PATH="$deps_prefix" \
            -DPKG_CONFIG_EXECUTABLE="$(command -v pkg-config)" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX_PATH"

          # 构建（不指定目标）
          cmake --build build/release -j"$jobs"

          # 直接打包构建产物中所有以 aria2 开头的可执行文件
          # 创建一个临时打包目录，保持 bin/ 结构
          PACKAGE_DIR="$repo_root/aria2-package"
          mkdir -p "$PACKAGE_DIR/bin"

          # 查找所有以 aria2 开头的可执行文件（排除 _tests）
          find build/release -maxdepth 1 -type f -executable -name "aria2*" ! -name "*_tests" -exec cp {} "$PACKAGE_DIR/bin/" \;

          # 如果找不到任何文件，报错退出
          if [ -z "$(ls -A "$PACKAGE_DIR/bin")" ]; then
            echo "No aria2 executable found in build/release"
            exit 1
          fi

          # 去掉调试符号（strip 所有复制进来的文件）
          strip "$PACKAGE_DIR/bin/"* 2>/dev/null || true

          # 打包（压缩包内顶层目录为 aria2-package，包含 bin/ 子目录）
          tar -C "$repo_root" -cJf "$repo_root/aria2-next-install-release.tar.xz" "aria2-package"
          echo "Package created: $repo_root/aria2-next-install-release.tar.xz"

      - name: Upload packaged install tree
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-install-${{ matrix.arch }}-release
          path: aria2-next-install-release.tar.xz
          if-no-files-found: error
          retention-days: 30
